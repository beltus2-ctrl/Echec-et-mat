name: Build Android APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'client/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install client dependencies
        run: npm ci

      - name: Build web assets
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://echec-et-mat-server.onrender.com' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/echec-et-mat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: echec-et-mat-apk
          path: client/android/app/build/outputs/apk/debug/echec-et-mat.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Échec & Mat — version Android ${{ github.run_number }}
          make_latest: true
          body: |
            📱 **Téléchargez `echec-et-mat.apk` ci-dessous et ouvrez-le sur votre téléphone Android.**
            Si Android le demande, autorisez « Installer des applications inconnues ».

            Contre l'ordinateur (8 niveaux) · Deux joueurs sur le même téléphone · Inviter un ami en ligne · Puzzles de mat.

            Construit depuis `${{ github.ref_name }}` (commit ${{ github.sha }}).
          files: client/android/app/build/outputs/apk/debug/echec-et-mat.apk
